<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小锅管理台</title>
  <style>
    :root{--ink:#302b27;--muted:#766b61;--line:#e7ddd0;--paper:#fffdf8;--canvas:#f6f0e6;--green:#3d8c70;--green-soft:#e5f3eb;--yellow:#f4c64e;--red:#b8534f}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 "Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.55}.hidden{display:none!important}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-box{width:min(400px,100%);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:30px;box-shadow:0 18px 45px #6b52371a}.brand{font-size:20px;font-weight:900;color:var(--green);margin:0 0 4px}.muted{color:var(--muted)}label{display:grid;gap:6px;font-weight:700;margin-top:16px}input,select,textarea{width:100%;border:1px solid #d9cfc2;border-radius:6px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:86px;resize:vertical}.primary{background:var(--green);color:#fff;border-radius:6px;padding:10px 15px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--ink);font-weight:700}.danger{color:var(--red);border-color:#e5b9b4}.message{min-height:20px;color:var(--red);margin:12px 0 0}.app-shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#fffdf8;border-right:1px solid var(--line);padding:22px 14px}.side h1{font-size:19px;margin:0 10px 22px}.side h1 span{color:var(--green)}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:800}.nav button.active,.nav button:hover{background:var(--green-soft);color:#28654f}.side-footer{position:fixed;bottom:18px;left:14px;right:14px;width:202px}.main{padding:25px;max-width:1400px;width:100%;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.topbar h2{margin:0;font-size:22px}.topbar p{margin:3px 0 0}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:7px;padding:16px}.stat b{display:block;font-size:27px;color:var(--green);margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-head h3{margin:0;font-size:17px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input{width:220px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;min-width:690px;background:#fff}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #eee6dc;vertical-align:middle}th{background:#faf6ef;color:#75695e;font-size:12px}tr:last-child td{border-bottom:0}.art{font-size:22px}.actions{display:flex;gap:7px}.small{padding:6px 9px;font-size:12px}.tag{display:inline-block;background:#fff2ca;padding:3px 7px;border-radius:999px;font-size:12px;margin:1px}.empty{text-align:center;color:var(--muted);padding:30px}.modal{position:fixed;inset:0;background:#2f292540;z-index:5;display:grid;place-items:center;padding:18px}.modal-body{width:min(850px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.form-grid .wide{grid-column:1/-1}.check-grid{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff}.check-grid label{display:flex;align-items:center;gap:5px;margin:0;padding:4px 6px;font-weight:500}.check-grid input{width:auto}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.record-note{max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.import-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.import-stat{padding:12px;border:1px solid var(--line);border-radius:7px;background:#fff}.import-stat b{color:var(--green);font-size:18px}.error-list{max-height:330px;overflow:auto;margin:16px 0;border:1px solid #e6c2bf;border-radius:7px}.error-list li{padding:9px 11px;border-bottom:1px solid #f0ddd9}.error-list li:last-child{border-bottom:0}@media(max-width:760px){.app-shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px}.side h1{margin-bottom:10px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{font-size:12px;text-align:center;padding:7px}.side-footer{position:static;width:auto;margin-top:10px}.main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.topbar{align-items:flex-start}.toolbar input{width:100%}.import-summary{grid-template-columns:1fr}}
    .topbar-actions{display:flex;align-items:center;gap:8px}.back-home{border-color:#b9daca;background:var(--green-soft);color:#28654f}.back-home:hover{background:#d7ecdf}.round-select{position:relative;min-width:150px}.round-select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #d9cfc2;border-radius:10px;background:#fff;color:var(--ink);font:inherit;text-align:left;transition:border-color .2s,background .2s}.round-select-trigger:hover,.round-select-trigger[aria-expanded="true"]{border-color:#9fc7de;background:#f9fcff}.round-select-arrow{display:grid;flex:0 0 18px;place-items:center;height:18px;font-size:18px;line-height:1}.round-options{position:absolute;top:calc(100% + 6px);left:0;z-index:4;display:none;width:100%;overflow:hidden;border:1px solid #bdd5e5;border-radius:10px;background:#fff;box-shadow:0 10px 20px #607d8b24}.round-options.open{display:block}.round-options button{display:block;width:100%;padding:10px 12px;background:#fff;color:var(--ink);text-align:left;transition:background .18s,color .18s}.round-options button:hover{background:#eef7fc;color:#276c95}.round-options button.active{background:#dceefa;color:#276c95;font-weight:800}#usersView .panel{min-height:calc(100vh - 160px);display:flex;flex-direction:column}#usersView #userTable{display:flex;flex:1;min-height:0;flex-direction:column}#userTable .table-wrap{display:flex;flex:1;min-height:230px;max-height:none}#userTable .table-wrap table{align-self:flex-start}#userTable .table-wrap:has(.round-options.open){overflow:visible}@media(max-width:760px){.topbar-actions{margin-left:12px}.back-home{white-space:nowrap}.round-select{min-width:150px}#usersView .panel{min-height:0;display:block}#usersView #userTable{display:block}#userTable .table-wrap{display:block;min-height:200px}}
    .pagination{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid #eee6dc;color:var(--muted);font-weight:700}.page-summary{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}.page-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}.pagination>.page-actions>.secondary{display:grid;place-items:center;width:34px;height:34px;padding:0;font-size:18px;line-height:1}.pagination>.page-actions>.secondary:not(:disabled):hover{border-color:#8fc0aa;background:var(--green-soft);color:#28654f}.page-of{white-space:nowrap;color:var(--ink);font-size:13px}.page-jump{position:relative;display:flex;align-items:center;width:88px;height:34px}.page-jump input{height:34px;padding:6px 30px 6px 10px;border-radius:6px;background:#fff;text-align:center;font-weight:800}.page-jump-toggle{position:absolute;top:2px;right:2px;bottom:2px;display:grid;place-items:center;width:30px;height:auto;padding:0;background:transparent;color:var(--muted);font-size:16px;line-height:1}.page-jump-toggle:hover{color:#28654f}.page-menu{position:absolute;right:0;bottom:calc(100% + 8px);z-index:8;display:none;width:88px;max-height:238px;overflow-y:auto;padding:5px;border:1px solid #cbdceb;border-radius:8px;background:#fff;box-shadow:0 12px 28px #4a697326}.page-menu.open{display:grid;gap:2px}.page-menu button{width:100%;min-height:30px;padding:5px 9px;border-radius:5px;background:transparent;color:var(--ink);font-weight:700;text-align:left}.page-menu button:hover,.page-menu button.active{background:#e7f2ff;color:#26719d}.admin-select{width:min(100%,240px);min-width:150px;padding:9px 30px 9px 10px;background:#fff}@media(max-width:760px){.pagination{align-items:flex-start;flex-wrap:wrap}.page-actions{width:100%;justify-content:flex-end}.admin-select{min-width:130px}}
    @media(min-width:761px){html,body{height:100%;overflow:hidden}.app-shell{display:block;height:100vh;min-height:0;padding-left:230px;overflow:hidden}.side{position:fixed;z-index:3;top:0;left:0;width:230px;height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden}.side-footer{position:static;left:auto;right:auto;bottom:auto;width:auto;margin-top:auto}.main{height:100vh;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;width:min(1400px,100%);margin:0 auto}}
    /* Keep every custom dropdown chevron centered in its own icon area. */
    .round-select-trigger{position:relative;justify-content:flex-start;padding-right:48px}
    .round-select-arrow,.page-jump-toggle{display:flex;align-items:center;justify-content:center;margin:0;padding:0;font-size:0;line-height:1;vertical-align:middle}
    .round-select-arrow{position:absolute;top:0;right:0;bottom:0;width:46px;height:auto;pointer-events:none}
    .round-select-arrow::after,.page-jump-toggle::after{content:"";display:block;width:7px;height:7px;margin:0;padding:0;border-right:2px solid currentColor;border-bottom:2px solid currentColor;line-height:0;transform:rotate(45deg)}
    .page-jump-toggle{top:0;right:0;bottom:0;width:34px;height:auto}
    @media(max-width:760px){.section-head{align-items:flex-start;flex-direction:column}.section-head .primary{width:100%}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}.table-wrap{overflow:visible;border:0;background:transparent}.table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap th,.table-wrap td{display:block;width:100%;min-width:0}.table-wrap thead{display:none}.table-wrap tr{margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.table-wrap td{display:grid;grid-template-columns:84px minmax(0,1fr);gap:9px;padding:9px 11px;min-height:40px;white-space:normal;overflow-wrap:anywhere}.table-wrap td::before{color:var(--muted);font-size:12px;font-weight:800}.table-wrap td:nth-child(1)::before{content:'信息'}.table-wrap td:nth-child(2)::before{content:'详情'}.table-wrap td:nth-child(3)::before{content:'状态'}.table-wrap td:nth-child(4)::before{content:'时间'}.table-wrap td:nth-child(5)::before{content:'操作'}.table-wrap td:nth-child(6)::before{content:'操作'}.table-wrap .actions{flex-wrap:wrap}.record-note{max-width:none;white-space:normal;overflow:visible;text-overflow:clip}#usersView .panel{min-height:0}#userTable .table-wrap{min-height:0}.round-select{min-width:0}.pagination{padding:12px 0}.pagination .table-wrap{display:block}}
  </style>
</head>
<body>
  <section id="loginView" class="login-shell">
    <form id="loginForm" class="login-box">
      <p class="brand">小锅管理台</p><p class="muted">管理员登录</p>
      <label>账号<input id="loginUsername" autocomplete="username" required></label>
      <label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" style="width:100%;margin-top:20px">登录</button><p id="loginMessage" class="message"></p>
    </form>
  </section>

  <section id="appView" class="app-shell hidden">
    <aside class="side"><h1><span>•ᴗ•</span> 小锅管理台</h1><nav class="nav" id="nav"><button data-view="dashboard" class="active">概览</button><button data-view="recipes">菜谱管理</button><button data-view="ingredients">食材管理</button><button data-view="users">用户管理</button><button data-view="records">烹饪记录</button><button data-view="backups">数据备份</button><button data-view="logs">操作日志</button></nav><div class="side-footer"><button id="changePasswordButton" class="secondary" style="width:100%;margin-bottom:8px">修改密码</button><button id="logoutButton" class="secondary" style="width:100%">退出登录</button></div></aside>
    <main class="main"><div class="topbar"><div><h2 id="pageTitle">概览</h2><p id="adminName" class="muted"></p></div><div class="topbar-actions"><button id="backToFront" class="secondary back-home" type="button">&lt; 返回主页面</button></div></div>
      <section id="dashboardView" class="view"><div id="stats" class="stats"></div><div class="panel"><div class="section-head"><h3>管理说明</h3></div><p class="muted">这里的菜谱和食材直接保存到 MySQL。用户页面刷新后会读取最新的公开菜谱数据。</p></div></section>
      <section id="recipesView" class="view hidden"><div class="panel"><div class="section-head"><h3>菜谱</h3><div class="toolbar"><input id="recipeSearch" placeholder="搜索菜谱"><button id="exportRecipes" class="secondary">下载 Excel</button><button id="importRecipes" class="secondary">导入 Excel</button><button id="addRecipe" class="primary">新增菜谱</button></div></div><div id="recipeTable"></div></div></section>
      <section id="ingredientsView" class="view hidden"><div class="panel"><div class="section-head"><h3>食材</h3><div class="toolbar"><button id="manageCategories" class="secondary">分类管理</button><button id="addIngredient" class="primary">新增食材</button></div></div><div id="ingredientTable"></div></div></section>
      <section id="usersView" class="view hidden"><div class="panel"><div class="section-head"><h3>用户</h3></div><div id="userTable"></div></div></section>
      <section id="recordsView" class="view hidden"><div class="panel"><div class="section-head"><h3>烹饪记录</h3></div><div id="recordTable"></div></div></section>
      <section id="backupsView" class="view hidden"><div class="panel"><div class="section-head"><div><h3>数据备份</h3><p class="muted">导入前、每天首次进入后台时都会自动保存快照；恢复前还会额外再保存一份。</p></div><button id="createBackup" class="primary">立即创建备份</button></div><div id="backupTable"></div></div></section>
      <section id="logsView" class="view hidden"><div class="panel"><div class="section-head"><div><h3>管理员操作日志</h3><p class="muted">记录菜谱、食材、用户权限、导入和备份相关操作。</p></div></div><div id="auditLogTable"></div></div></section>
    </main>
  </section>
  <div id="modal" class="modal hidden"><div id="modalBody" class="modal-body"></div></div><input id="importFile" class="hidden" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  <script>
    const state={ingredients:[],recipes:[],users:[]};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const toast=message=>alert(message);
    async function api(path,options={}){const headers={...(options.headers||{})};if(!(options.body instanceof FormData)&&!headers['Content-Type'])headers['Content-Type']='application/json';const response=await fetch(path,{credentials:'same-origin',headers,...options});const data=response.status===204?null:await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'请求失败');return data}
    function show(view){document.querySelectorAll('.view').forEach(item=>item.classList.toggle('hidden',item.id!==view+'View'));document.querySelectorAll('#nav button').forEach(item=>item.classList.toggle('active',item.dataset.view===view));$('#pageTitle').textContent={dashboard:'概览',recipes:'菜谱管理',ingredients:'食材管理',users:'用户管理',records:'烹饪记录',backups:'数据备份',logs:'操作日志'}[view];({dashboard:loadDashboard,recipes:loadRecipes,ingredients:loadIngredients,users:loadUsers,records:loadRecords,backups:loadBackups,logs:loadAuditLogs}[view])()}
    async function loadDashboard(){const data=await api('/api/admin/summary');$('#stats').innerHTML=[['菜谱',data.recipes],['食材',data.ingredients],['用户',data.users],['烹饪记录',data.records]].map(([name,count])=>`<div class="stat"><span class="muted">${name}</span><b>${count}</b></div>`).join('')}
    async function loadRecipes(){state.recipes=await api('/api/admin/recipes');renderRecipes()}
    function renderRecipes(){const q=$('#recipeSearch').value.trim();const rows=state.recipes.filter(r=>!q||r.name.includes(q)||r.id.includes(q));$('#recipeTable').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>菜谱</th><th>食材</th><th>时长</th><th>难度</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="art">${esc(r.art)}</span> <b>${esc(r.name)}</b><br><small class="muted">${esc(r.id)}</small></td><td>${r.ingredient_names.map(esc).join('、')}</td><td>${r.minutes} 分钟</td><td>${esc(r.diff)}</td><td><div class="actions"><button class="secondary small" onclick="editRecipe('${r.id}')">编辑</button><button class="secondary danger small" onclick="deleteRecipe('${r.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">没有符合条件的菜谱</p>'}
    async function loadIngredients(){state.ingredients=await api('/api/admin/ingredients');renderIngredients()}
    function renderIngredients(){$('#ingredientTable').innerHTML=state.ingredients.length?`<div class="table-wrap"><table><thead><tr><th>食材</th><th>分类</th><th>被菜谱使用</th><th>操作</th></tr></thead><tbody>${state.ingredients.map(i=>`<tr><td><span class="art">${esc(i.icon)}</span> <b>${esc(i.name)}</b><br><small class="muted">${esc(i.id)}</small></td><td>${esc(i.category)}</td><td>${i.recipe_count} 道</td><td><div class="actions"><button class="secondary small" onclick="editIngredient('${i.id}')">编辑</button><button class="secondary danger small" onclick="deleteIngredient('${i.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">还没有食材</p>'}
    function userSelect(id,field,value,options){const selected=options.find(option=>option[0]===value)||options[0];const key=`${field}-${id}`;return `<div class="round-select" data-select="${key}" data-value="${esc(value)}"><button type="button" class="round-select-trigger" aria-expanded="false" onclick="toggleUserSelect(event,'${key}')"><span class="round-select-label">${esc(selected[1])}</span><span class="round-select-arrow" aria-hidden="true">⌄</span></button><div id="${key}-options" class="round-options">${options.map(option=>`<button type="button" class="${option[0]===value?'active':''}" onclick="chooseUserSelect('${key}','${option[0]}','${option[1]}')">${esc(option[1])}</button>`).join('')}</div></div>`}
    function closeUserSelects(exceptKey=''){document.querySelectorAll('.round-options.open').forEach(menu=>{if(menu.id!==`${exceptKey}-options`)menu.classList.remove('open')});document.querySelectorAll('.round-select-trigger[aria-expanded="true"]').forEach(button=>{if(!exceptKey||button.parentElement.dataset.select!==exceptKey)button.setAttribute('aria-expanded','false')})}
    function toggleUserSelect(event,key){event.stopPropagation();const menu=$('#'+key+'-options');const trigger=menu.previousElementSibling;const opening=!menu.classList.contains('open');closeUserSelects();menu.classList.toggle('open',opening);trigger.setAttribute('aria-expanded',String(opening))}
    function chooseUserSelect(key,value,label){const root=document.querySelector(`[data-select="${key}"]`);root.dataset.value=value;root.querySelector('.round-select-label').textContent=label;root.querySelectorAll('.round-options button').forEach(button=>button.classList.toggle('active',button.textContent===label));root.querySelector('.round-options').classList.remove('open');root.querySelector('.round-select-trigger').setAttribute('aria-expanded','false')}
    async function loadUsers(){state.users=await api('/api/admin/users');state.userPage=1;renderUsers()}
    function renderUsers(){const result=pageSlice(state.users,'userPage');$('#userTable').innerHTML=state.users.length?`<div class="table-wrap"><table><thead><tr><th>账号</th><th>显示名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${result.rows.map(u=>`<tr><td>${esc(u.external_key)}</td><td>${esc(u.display_name)}</td><td>${userSelect(u.id,'role',u.role,[['user','用户'],['admin','管理员']])}</td><td>${userSelect(u.id,'active',String(Boolean(u.is_active)),[['true','启用'],['false','停用']])}</td><td>${new Date(u.created_at).toLocaleString()}</td><td><button class="secondary small" onclick="saveUser(${u.id})">保存</button></td></tr>`).join('')}</tbody></table></div>${pageControls('users','userPage',state.users.length,result.page,result.totalPages)}`:'<p class="empty">还没有用户</p>'}
    async function loadRecords(){const rows=await api('/api/admin/cooking-records');$('#recordTable').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>用户</th><th>菜谱</th><th>评分</th><th>心得</th><th>完成时间</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.user_key)}</td><td>${esc(r.recipe_name)}</td><td>${r.rating||'—'}</td><td class="record-note" title="${esc(r.notes||'')}">${esc(r.notes||'—')}</td><td>${new Date(r.finished_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">还没有烹饪记录</p>'}
    const backupTypeName={import:'导入前快照',manual:'手动备份',scheduled:'每日自动备份',restore:'恢复前快照'};const actionName={'recipe.create':'新增菜谱','recipe.update':'编辑菜谱','recipe.delete':'删除菜谱','ingredient.create':'新增食材','ingredient.update':'编辑食材','ingredient.delete':'删除食材','category.create':'新增分类','category.delete':'删除分类','user.update_access':'修改用户权限','catalogue.import':'Excel 导入','backup.manual':'手动创建备份','backup.scheduled':'每日自动备份','backup.restore':'恢复备份','backup.download':'下载备份','admin.change_password':'修改管理员密码'};function backupSummary(summary){return `菜谱 ${summary?.recipes??0} · 食材 ${summary?.ingredients??0} · 分类 ${summary?.categories??0}`}async function loadBackups(){const rows=await api('/api/admin/backups');$('#backupTable').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>备份</th><th>数据量</th><th>创建人</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${esc(backupTypeName[b.backup_type]||b.backup_type)}</b><br><small class="muted">${esc(b.label)}</small></td><td>${esc(backupSummary(b.summary))}</td><td>${esc(b.created_by_name||'系统')}</td><td>${new Date(b.created_at).toLocaleString()}</td><td><div class="actions"><a class="secondary small" href="/api/admin/backups/${b.id}/download">下载</a><button class="secondary small" onclick="restoreBackup(${b.id})">恢复</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">还没有备份，先创建一份吧。</p>'}async function createBackup(){const button=$('#createBackup');button.disabled=true;button.textContent='正在备份…';try{await api('/api/admin/backups',{method:'POST'});await loadBackups();toast('备份已经保存到数据库登记和本地 backups 文件夹。')}catch(error){alert(error.message)}finally{button.disabled=false;button.textContent='立即创建备份'}}async function restoreBackup(id){if(!confirm('恢复会覆盖备份中已有的菜谱、食材和步骤。恢复前会先自动保存当前数据，确定继续吗？'))return;try{const result=await api(`/api/admin/backups/${id}/restore`,{method:'POST'});alert(`恢复完成：已还原 ${result.summary.recipes.insert+result.summary.recipes.update} 道菜谱。`);await Promise.all([loadBackups(),loadRecipes(),loadIngredients(),loadDashboard()])}catch(error){alert(error.message)}}async function loadAuditLogs(){const rows=await api('/api/admin/audit-logs');$('#auditLogTable').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>对象</th><th>摘要</th></tr></thead><tbody>${rows.map(log=>`<tr><td>${new Date(log.created_at).toLocaleString()}</td><td>${esc(log.admin_name||'系统')}</td><td><b>${esc(actionName[log.action]||log.action)}</b></td><td>${esc(log.target_type)}${log.target_id?` · ${esc(log.target_id)}`:''}</td><td class="record-note" title="${esc(JSON.stringify(log.details||{}))}">${esc(JSON.stringify(log.details||{}))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">还没有管理员操作日志</p>'}
    function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
    function importSummary(summary){return `<div class="import-summary"><div class="import-stat">食材<br><b>新增 ${summary.ingredients.insert} · 更新 ${summary.ingredients.update}</b></div><div class="import-stat">菜谱<br><b>新增 ${summary.recipes.insert} · 更新 ${summary.recipes.update}</b></div><div class="import-stat">菜谱食材关联<br><b>${summary.links} 条</b></div><div class="import-stat">烹饪步骤<br><b>${summary.steps} 条</b></div></div>`}
    function showImportPreview(result){if(!result.valid){const errors=(result.errors||[]).slice(0,100);openModal(`<div class="section-head"><h3>Excel 校验未通过</h3><button class="secondary" onclick="closeModal()">关闭</button></div><p class="muted">请按下列提示修改 Excel 后重新上传；本次没有写入数据库。</p><ul class="error-list">${errors.map(item=>`<li><b>${esc(item.sheet)} 第 ${item.row} 行 · ${esc(item.field)}</b><br>${esc(item.message)}</li>`).join('')}</ul>`);return}openModal(`<div class="section-head"><h3>确认导入 Excel</h3><button class="secondary" onclick="closeModal()">关闭</button></div><p class="muted">确认后会新增或更新食材和菜谱，并完整替换本次 Excel 中对应菜谱的食材关联与步骤。</p>${importSummary(result.summary)}<div class="form-actions"><button class="secondary" onclick="closeModal()">取消</button><button id="commitImport" class="primary">确认写入数据库</button></div>`);$('#commitImport').onclick=async()=>{const button=$('#commitImport');button.disabled=true;button.textContent='正在写入…';try{const response=await api('/api/admin/import/commit',{method:'POST',body:JSON.stringify({token:result.token})});closeModal();alert(`已写入 MySQL，刷新页面后仍会保留：新增或更新 ${response.summary.ingredients.insert+response.summary.ingredients.update} 个食材、${response.summary.recipes.insert+response.summary.recipes.update} 道菜谱。`);loadRecipes();loadIngredients();loadDashboard()}catch(err){button.disabled=false;button.textContent='确认写入数据库';alert(err.message)}}}
    async function previewImport(file){const body=new FormData();body.append('file',file);try{showImportPreview(await api('/api/admin/import/preview',{method:'POST',body}))}catch(err){alert(err.message)}}
    async function openCategoryManager(){const rows=await api('/api/admin/ingredient-categories');openModal(`<div class="section-head"><h3>分类管理</h3><button class="secondary" onclick="closeModal()">关闭</button></div><p class="muted">新增分类后，可在食材编辑和 Excel 的“分类”列填写相同名称。已有食材的分类不能删除。</p><form id="categoryForm" class="toolbar"><input name="name" placeholder="例如：调味料" required><button class="primary">新增分类</button></form><p id="formMessage" class="message"></p><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>分类</th><th>食材数量</th><th>操作</th></tr></thead><tbody>${rows.map(row=>`<tr><td><b>${esc(row.name)}</b></td><td>${row.ingredient_count}</td><td>${row.ingredient_count?'<span class="muted">正在使用</span>':`<button class="secondary danger small" data-delete-category="${esc(row.name)}">删除</button>`}</td></tr>`).join('')}</tbody></table></div>`);document.querySelectorAll('[data-delete-category]').forEach(button=>button.onclick=()=>deleteCategory(button.dataset.deleteCategory));$('#categoryForm').onsubmit=async event=>{event.preventDefault();const name=new FormData(event.currentTarget).get('name').trim();try{await api('/api/admin/ingredient-categories',{method:'POST',body:JSON.stringify({name})});openCategoryManager()}catch(err){$('#formMessage').textContent=err.message}}}
    async function deleteCategory(name){if(!confirm(`确定删除分类“${name}”吗？`))return;try{await api('/api/admin/ingredient-categories/'+encodeURIComponent(name),{method:'DELETE'});openCategoryManager()}catch(err){alert(err.message)}}
    async function openRecipe(recipe){if(!state.ingredients.length)state.ingredients=await api('/api/admin/ingredients');const isNew=!recipe;const selected=new Set(recipe?.ingredient_ids||[]);openModal(`<div class="section-head"><h3>${isNew?'新增':'编辑'}菜谱</h3><button class="secondary" onclick="closeModal()">关闭</button></div><form id="recipeForm"><div class="form-grid"><label>菜谱编号<input name="id" ${isNew?'':'readonly'} value="${esc(recipe?.id||'')}" placeholder="例如 tomato-noodle" required></label><label>菜谱名称<input name="name" value="${esc(recipe?.name||'')}" required></label><label>Q 版插画<input name="art" value="${esc(recipe?.art||'🍲')}" required></label><label>时长（分钟）<input name="minutes" type="number" min="1" value="${recipe?.minutes||15}" required></label><label>难度<input name="diff" value="${esc(recipe?.diff||'新手')}" required></label><label>热量（kcal）<input name="calories" type="number" min="0" value="${recipe?.calories||200}" required></label><label class="wide">简介<textarea name="desc" required>${esc(recipe?.desc||'')}</textarea></label><label class="wide">标签（用中文逗号或英文逗号分隔）<input name="tags" value="${esc((recipe?.tags||[]).join('、'))}"></label><label class="wide">食材<div class="check-grid">${state.ingredients.map(i=>`<label><input type="checkbox" value="${esc(i.id)}" ${selected.has(i.id)?'checked':''}>${esc(i.icon)} ${esc(i.name)}</label>`).join('')}</div></label><label class="wide">步骤（每行一步）<textarea name="steps" required>${esc((recipe?.steps||[]).join('\n'))}</textarea></label></div><p id="formMessage" class="message"></p><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存菜谱</button></div></form>`);$('#recipeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const payload={id:f.get('id').trim(),name:f.get('name').trim(),art:f.get('art').trim(),minutes:f.get('minutes'),diff:f.get('diff').trim(),calories:f.get('calories'),desc:f.get('desc').trim(),tags:f.get('tags').split(/[、,，]/).map(x=>x.trim()).filter(Boolean),ingredient_ids:[...e.currentTarget.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),steps:f.get('steps').split('\n').map(x=>x.trim()).filter(Boolean)};try{await api(isNew?'/api/admin/recipes':'/api/admin/recipes/'+recipe.id,{method:isNew?'POST':'PUT',body:JSON.stringify(payload)});closeModal();loadRecipes();loadDashboard()}catch(err){$('#formMessage').textContent=err.message}}}
    function editRecipe(id){openRecipe(state.recipes.find(r=>r.id===id))}async function deleteRecipe(id){if(confirm('确定删除这道菜谱吗？该操作不可恢复。')){try{await api('/api/admin/recipes/'+id,{method:'DELETE'});loadRecipes();loadDashboard()}catch(err){alert(err.message)}}}
    function openIngredient(item){const isNew=!item;openModal(`<div class="section-head"><h3>${isNew?'新增':'编辑'}食材</h3><button class="secondary" onclick="closeModal()">关闭</button></div><form id="ingredientForm"><div class="form-grid"><label>英文编号<input name="id" ${isNew?'':'readonly'} value="${esc(item?.id||'')}" placeholder="例如 broccoli" required></label><label>名称<input name="name" value="${esc(item?.name||'')}" required></label><label>分类<input name="category" value="${esc(item?.category||'蔬菜')}" required></label><label>Q 版图标<input name="icon" value="${esc(item?.icon||'🥬')}" required></label></div><p id="formMessage" class="message"></p><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存食材</button></div></form>`);$('#ingredientForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const data=Object.fromEntries(f.entries());try{await api(isNew?'/api/admin/ingredients':'/api/admin/ingredients/'+item.id,{method:isNew?'POST':'PUT',body:JSON.stringify(data)});closeModal();loadIngredients();loadDashboard()}catch(err){$('#formMessage').textContent=err.message}}}
    function editIngredient(id){openIngredient(state.ingredients.find(i=>i.id===id))}async function deleteIngredient(id){if(confirm('确定删除这个食材吗？')){try{await api('/api/admin/ingredients/'+id,{method:'DELETE'});loadIngredients();loadDashboard()}catch(err){alert(err.message)}}}async function saveUser(id){const role=document.querySelector(`[data-select="role-${id}"]`)?.dataset.value;const active=document.querySelector(`[data-select="active-${id}"]`)?.dataset.value;try{await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({role,is_active:active==='true'})});loadUsers()}catch(err){alert(err.message)}}
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMessage').textContent='';try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#loginUsername').value,password:$('#loginPassword').value})});boot(data.username)}catch(err){$('#loginMessage').textContent=err.message}};$('#logoutButton').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#loginPassword').value=''};$('#backToFront').onclick=()=>{window.location.href='http://localhost:5241/'};$('#changePasswordButton').onclick=()=>{openModal(`<div class="section-head"><h3>修改管理员密码</h3><button class="secondary" onclick="closeModal()">关闭</button></div><form id="passwordForm"><label>当前密码<input name="current" type="password" required></label><label>新密码（至少 10 位）<input name="next" type="password" minlength="10" required></label><p id="formMessage" class="message"></p><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存新密码</button></div></form>`);$('#passwordForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/api/auth/password',{method:'POST',body:JSON.stringify({current_password:f.get('current'),new_password:f.get('next')})});closeModal();alert('密码已更新，请妥善保管。')}catch(err){$('#formMessage').textContent=err.message}}};$('#nav').onclick=e=>{const button=e.target.closest('button[data-view]');if(button)show(button.dataset.view)};document.addEventListener('click',()=>closeUserSelects());$('#recipeSearch').oninput=renderRecipes;$('#addRecipe').onclick=()=>openRecipe(null);$('#exportRecipes').onclick=()=>{window.location.href='/api/admin/export.xlsx'};$('#importRecipes').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const [file]=e.target.files;if(file)previewImport(file);e.target.value=''};$('#addIngredient').onclick=()=>openIngredient(null);$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};function boot(username){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#adminName').textContent='当前管理员：'+username;show('dashboard')}(async()=>{const me=await api('/api/auth/me');if(me.authenticated)boot(me.username)})().catch(()=>{});
  </script>
  <script>document.getElementById('manageCategories').onclick=()=>openCategoryManager();document.getElementById('createBackup').onclick=createBackup</script>
  <script>
    const PAGE_SIZE=10;
    state.recipePage=1;state.ingredientPage=1;state.userPage=1;
    function pageSlice(rows,pageKey){const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));const page=Math.min(Math.max(1,Number(state[pageKey])||1),totalPages);state[pageKey]=page;return{rows:rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),page,totalPages}}
    function pageControls(view,pageKey,totalRows,page,totalPages){if(!totalRows)return'';const options=Array.from({length:totalPages},(_,index)=>`<button type="button" class="${index+1===page?'active':''}" onclick="setPage('${view}',${index+1})">${index+1}</button>`).join('');return `<nav class="pagination" aria-label="${view}分页"><span class="page-summary">共 ${totalPages} 页 · ${totalRows} 条</span><div class="page-actions"><button class="secondary" type="button" title="上一页" aria-label="上一页" onclick="setPage('${view}',${page-1})" ${page===1?'disabled':''}>&lt;</button><div class="page-jump"><input id="page-input-${view}" type="number" min="1" max="${totalPages}" value="${page}" aria-label="输入页码" onclick="openPageMenu(event,'${view}')" onchange="setPage('${view}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();setPage('${view}',this.value)}"><button class="page-jump-toggle" type="button" title="选择页码" aria-label="选择页码" aria-expanded="false" onclick="togglePageMenu(event,'${view}')">⌄</button><div id="page-menu-${view}" class="page-menu">${options}</div></div><span class="page-of">/ ${totalPages} 页</span><button class="secondary" type="button" title="下一页" aria-label="下一页" onclick="setPage('${view}',${page+1})" ${page===totalPages?'disabled':''}>&gt;</button></div></nav>`}
    function closePageMenus(exceptView=''){document.querySelectorAll('.page-menu.open').forEach(menu=>{if(menu.id!==`page-menu-${exceptView}`)menu.classList.remove('open')});document.querySelectorAll('.page-jump-toggle[aria-expanded="true"]').forEach(button=>{if(!exceptView||!button.closest('.page-jump')?.querySelector(`#page-menu-${exceptView}`))button.setAttribute('aria-expanded','false')})}
    function openPageMenu(event,view){event.stopPropagation();closePageMenus(view);const menu=$('#page-menu-'+view);if(menu){menu.classList.add('open');menu.previousElementSibling.setAttribute('aria-expanded','true')}}
    function togglePageMenu(event,view){event.stopPropagation();const menu=$('#page-menu-'+view);if(!menu)return;const opening=!menu.classList.contains('open');closePageMenus();menu.classList.toggle('open',opening);menu.previousElementSibling.setAttribute('aria-expanded',String(opening))}
    function setPage(view,page){closePageMenus();if(view==='recipes'){state.recipePage=Number(page);renderRecipes()}else if(view==='ingredients'){state.ingredientPage=Number(page);renderIngredients()}else if(view==='users'){state.userPage=Number(page);renderUsers()}document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'})}
    async function loadRecipes(){state.recipes=await api('/api/admin/recipes');state.recipePage=1;renderRecipes()}
    function renderRecipes(){const q=$('#recipeSearch').value.trim();const filtered=state.recipes.filter(recipe=>!q||recipe.name.includes(q)||recipe.id.includes(q));const result=pageSlice(filtered,'recipePage');$('#recipeTable').innerHTML=filtered.length?`<div class="table-wrap"><table><thead><tr><th>菜谱</th><th>食材</th><th>时长</th><th>难度</th><th>操作</th></tr></thead><tbody>${result.rows.map(recipe=>`<tr><td><span class="art">${esc(recipe.art)}</span> <b>${esc(recipe.name)}</b><br><small class="muted">${esc(recipe.id)}</small></td><td>${recipe.ingredient_names.map(esc).join('、')}</td><td>${recipe.minutes} 分钟</td><td>${esc(recipe.diff)}</td><td><div class="actions"><button class="secondary small" onclick="editRecipe('${recipe.id}')">编辑</button><button class="secondary danger small" onclick="deleteRecipe('${recipe.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div>${pageControls('recipes','recipePage',filtered.length,result.page,result.totalPages)}`:'<p class="empty">没有符合条件的菜谱</p>'}
    async function loadIngredients(){state.ingredients=await api('/api/admin/ingredients');state.ingredientPage=1;renderIngredients()}
    function renderIngredients(){const result=pageSlice(state.ingredients,'ingredientPage');$('#ingredientTable').innerHTML=state.ingredients.length?`<div class="table-wrap"><table><thead><tr><th>食材</th><th>分类</th><th>被菜谱使用</th><th>操作</th></tr></thead><tbody>${result.rows.map(ingredient=>`<tr><td><span class="art">${esc(ingredient.icon)}</span> <b>${esc(ingredient.name)}</b><br><small class="muted">${esc(ingredient.id)}</small></td><td>${esc(ingredient.category)}</td><td>${ingredient.recipe_count} 道</td><td><div class="actions"><button class="secondary small" onclick="editIngredient('${ingredient.id}')">编辑</button><button class="secondary danger small" onclick="deleteIngredient('${ingredient.id}')">删除</button></div></td></tr>`).join('')}</tbody></table></div>${pageControls('ingredients','ingredientPage',state.ingredients.length,result.page,result.totalPages)}`:'<p class="empty">还没有食材</p>'}
    $('#recipeSearch').oninput=()=>{state.recipePage=1;renderRecipes()};document.addEventListener('click',()=>closePageMenus());
  </script>
  <script>
    function parseSeasoningText(value){return String(value||'').split(/\n+/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split(/\s+/);if(parts.length===1)return {icon:'🧂',name:parts[0]};return {icon:parts[0],name:parts.slice(1).join(' ')}}).filter(item=>item.name)}
    function seasoningText(recipe){return (recipe?.seasonings||[]).map(item=>`${item.icon} ${item.name}`).join('\n')}
    function importSummary(summary){return `<div class="import-summary"><div class="import-stat">食材<br><b>新增 ${summary.ingredients.insert} · 更新 ${summary.ingredients.update}</b></div><div class="import-stat">菜谱<br><b>新增 ${summary.recipes.insert} · 更新 ${summary.recipes.update}</b></div><div class="import-stat">菜谱食材关联<br><b>${summary.links} 条</b></div><div class="import-stat">菜谱调味料<br><b>${summary.seasonings||0} 条</b></div><div class="import-stat">烹饪步骤<br><b>${summary.steps} 条</b></div></div>`}
    function showImportPreview(result){if(!result.valid){const errors=(result.errors||[]).slice(0,100);openModal(`<div class="section-head"><h3>Excel 校验未通过</h3><button class="secondary" onclick="closeModal()">关闭</button></div><p class="muted">请按下列提示修改 Excel 后重新上传；本次没有写入数据库。</p><ul class="error-list">${errors.map(item=>`<li><b>${esc(item.sheet)} 第 ${item.row} 行 · ${esc(item.field)}</b><br>${esc(item.message)}</li>`).join('')}</ul>`);return}openModal(`<div class="section-head"><h3>确认导入 Excel</h3><button class="secondary" onclick="closeModal()">关闭</button></div><p class="muted">确认后会新增或更新食材、菜谱、调味料，并完整替换本次 Excel 中对应菜谱的食材关联、调味料和步骤。</p>${importSummary(result.summary)}<div class="form-actions"><button class="secondary" onclick="closeModal()">取消</button><button id="commitImport" class="primary">确认写入数据库</button></div>`);$('#commitImport').onclick=async()=>{const button=$('#commitImport');button.disabled=true;button.textContent='正在写入…';try{const response=await api('/api/admin/import/commit',{method:'POST',body:JSON.stringify({token:result.token})});closeModal();alert(`已写入 MySQL，刷新页面后仍会保留：新增或更新 ${response.summary.ingredients.insert+response.summary.ingredients.update} 个食材、${response.summary.recipes.insert+response.summary.recipes.update} 道菜谱。`);loadRecipes();loadIngredients();loadDashboard()}catch(err){button.disabled=false;button.textContent='确认写入数据库';alert(err.message)}}}
    openRecipe=async function(recipe){if(!state.ingredients.length)state.ingredients=await api('/api/admin/ingredients');const isNew=!recipe;const selected=new Set(recipe?.ingredient_ids||[]);const seasonings=seasoningText(recipe);openModal(`<div class="section-head"><h3>${isNew?'新增':'编辑'}菜谱</h3><button class="secondary" onclick="closeModal()">关闭</button></div><form id="recipeForm"><div class="form-grid"><label>菜谱编号<input name="id" ${isNew?'':'readonly'} value="${esc(recipe?.id||'')}" placeholder="例如 tomato-noodle" required></label><label>菜谱名称<input name="name" value="${esc(recipe?.name||'')}" required></label><label>Q 版插画<input name="art" value="${esc(recipe?.art||'🍳')}" required></label><label>时长（分钟）<input name="minutes" type="number" min="1" value="${recipe?.minutes||15}" required></label><label>难度<input name="diff" value="${esc(recipe?.diff||'新手')}" required></label><label>热量（kcal）<input name="calories" type="number" min="0" value="${recipe?.calories||200}" required></label><label class="wide">简介<textarea name="desc" required>${esc(recipe?.desc||'')}</textarea></label><label class="wide">标签（用中文逗号或英文逗号分隔）<input name="tags" value="${esc((recipe?.tags||[]).join(','))}"></label><label class="wide">食材<div class="check-grid">${state.ingredients.map(i=>`<label><input type="checkbox" value="${esc(i.id)}" ${selected.has(i.id)?'checked':''}>${esc(i.icon)} ${esc(i.name)}</label>`).join('')}</div></label><label class="wide">调味料（每行一个，格式：图标 名称）<textarea name="seasonings" required>${esc(seasonings)}</textarea></label><label class="wide">步骤（每行一个步骤）<textarea name="steps" required>${esc((recipe?.steps||[]).join('\n'))}</textarea></label></div><p id="formMessage" class="message"></p><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存菜谱</button></div></form>`);$('#recipeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const payload={id:f.get('id').trim(),name:f.get('name').trim(),art:f.get('art').trim(),minutes:f.get('minutes'),diff:f.get('diff').trim(),calories:f.get('calories'),desc:f.get('desc').trim(),tags:f.get('tags').split(/[、,，]/).map(x=>x.trim()).filter(Boolean),ingredient_ids:[...e.currentTarget.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),seasonings:parseSeasoningText(f.get('seasonings')),steps:f.get('steps').split('\n').map(x=>x.trim()).filter(Boolean)};try{await api(isNew?'/api/admin/recipes':'/api/admin/recipes/'+recipe.id,{method:isNew?'POST':'PUT',body:JSON.stringify(payload)});closeModal();loadRecipes();loadDashboard()}catch(err){$('#formMessage').textContent=err.message}}}
  </script>
</body>
</html>
